<meta name="theme-color" content="#000000" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Apple dark surfaces — near-black with layered greys */
  --bg:#000000;--sf:#1d1d1f;--sf2:#252527;--sf3:#2d2d2f;
  --bd:#38383a;--bd2:#48484a;
  /* Text hierarchy — Apple's exact greys */
  --t0:#f5f5f7;--t1:#e8e8ed;--t2:#a1a1a6;--t3:#86868b;--t4:#6e6e73;--t5:#48484a;
  /* Functional colors — Apple system palette */
  --gn:#30d158;--gnb:#0a1f10;--gnd:#1a5230;
  --rd:#ff453a;--rdb:#1f0a08;--rdd:#5c221e;
  --yw:#ffd60a;--ywb:#1f1a05;--ywd:#5c4e12;
  --bl:#2997ff;--blb:#08161f;--bld:#1a4266;
  --pp:#bf5af2;--cy:#64d2ff;
  /* Fonts — SF Pro system stack (Apple's actual font, free on their devices; graceful fallback elsewhere) */
  --mn:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --sn:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t0);font-family:var(--sn);min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.01em}
/* ─── Ambient background — subtle financial glow (Apple-style depth) ─── */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient::before{content:'';position:absolute;top:-20%;left:-10%;width:60%;height:70%;background:radial-gradient(circle,rgba(41,151,255,.09),transparent 65%);filter:blur(60px)}
.ambient::after{content:'';position:absolute;top:-10%;right:-15%;width:55%;height:60%;background:radial-gradient(circle,rgba(48,209,88,.06),transparent 65%);filter:blur(70px)}
#mainApp{position:relative;z-index:1}

/* ─── Header — Apple sticky nav with blur ─── */
.hdr{background:rgba(29,29,31,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,.08);padding:22px 32px 20px;position:sticky;top:0;z-index:100}
.hi{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.brand{font-family:var(--sn);font-size:11px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;font-weight:500}
h1{font-size:26px;font-weight:600;letter-spacing:-.022em;margin-top:3px;color:#fff}
.sub{color:var(--t3);font-size:14px;margin-top:4px;font-weight:400;letter-spacing:-.01em}
.conn{font-size:11px;color:var(--t4);display:flex;align-items:center;gap:5px;margin-top:6px;font-family:var(--sn);font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px;box-shadow:0 0 8px currentColor}
.ar{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--t4);margin-top:2px;font-family:var(--mn)}

/* ─── KPI boxes — Apple frosted cards ─── */
.sts{display:flex;gap:10px;flex-wrap:wrap}

  if(!FB.apiKey||!FB.databaseURL){sC("local");lL();loadCustomTickers();rn();return}
  try{firebase.initializeApp(FB);db=firebase.database();dr=db.ref("earnings-tracker");uf=true;sC("connecting");
    dr.child("checks").on("value",s=>{ck=s.val()||{};sC("ok");rn()});
    dr.child("custom-tickers").on("value",s=>{
      const val=s.val()||[];
      const arr=Array.isArray(val)?val:Object.values(val);
      arr.forEach(c=>{
        if(!c||typeof c!=="object"||!c.t)return;
        if(!P.find(p=>p&&p.t===c.t)){c._custom=true;P.push(c)}
      });
      rn();
    });
    dr.child("hidden-tickers").on("value",s=>{hiddenTickers=s.val()||[];rn()});
    dr.child("verified-dates").on("value",s=>{
      try{if(typeof applyVerifiedDates==="function"&&applyVerifiedDates(s.val()))rn()}
      catch(e){console.error("[verify] listener error:",e)}
    });
    dr.child("emailjs-config").on("value",s=>{const c=s.val();if(c){EJ.serviceId=c.serviceId||"";EJ.templateId=c.templateId||"";EJ.publicKey=c.publicKey||"";if(c.emails&&c.emails.length)ALERT_EMAILS=c.emails;if(typeof c.alertPrev==="boolean")alertPrevDay=c.alertPrev;if(c.testEmail)TEST_EMAIL=c.testEmail}});
  }catch(e){sC("local");lL();loadCustomTickers();rn()}}
function sC(s){const d=document.getElementById("cD"),t=document.getElementById("cT");
  if(s==="ok"){d.style.background="var(--gn)";t.textContent="Firebase conectado";t.style.color="var(--gn)"}
  else if(s==="connecting"){d.style.background="var(--yw)";t.textContent="Conectando...";t.style.color="var(--yw)"}
  else{d.style.background="var(--t3)";t.textContent="Modo local";t.style.color="var(--t3)"}}
function lL(){try{const r=localStorage.getItem("ia-e");if(r)ck=JSON.parse(r)}catch(e){}}

function rAS(){const r=document.getElementById("aR");
  const cl=cmfS==="ok"?"✓ CMF (chilenas)":cmfS==="loading"?"⟳ CMF...":cmfS==="error"?"✗ CMF":"· CMF";
  const cc=cmfS==="ok"?"var(--cy)":cmfS==="error"?"var(--rd)":"var(--t4)";
  r.innerHTML=`<span style="color:${cc}">${cl}</span><span style="color:var(--t4)">· Intl: fechas verificadas</span>`}

function bE(){
  return P.filter(co=>!hiddenTickers.includes(co.t)).flatMap(co=>co.q.map(qr=>{
    const rp=qr.rep||ic(co.t,qr.q,"reported");
    return{t:co.t,n:co.n,s:co.s,x:co.x,q:qr.q,d:qr.d,cf:qr.cf,rep:rp,st:gs(qr.d,rp),dy:dt(qr.d),src:qr._s||"manual",_c:co._custom||false};
  })).sort((a,b)=>{if(!a.d&&!b.d)return 0;if(!a.d)return 1;if(!b.d)return-1;return new Date(a.d)-new Date(b.d)})}

function rn(){try{
  const all=bE();const sQ=sq.toLowerCase();
  const dated=all.filter(e=>e.d);
  let f=all;
  if(cf==="pending")f=f.filter(e=>!e.rep&&e.d);
  if(cf==="done")f=f.filter(e=>e.rep);
  if(sQ)f=f.filter(e=>e.t.toLowerCase().includes(sQ)||e.n.toLowerCase().includes(sQ)||e.s.toLowerCase().includes(sQ));
  const rc=dated.filter(e=>e.rep).length,mc=dated.filter(e=>ic(e.t,e.q,"model")).length;
  const nx=dated.find(e=>!e.rep&&e.d);

  const rpPct=dated.length?Math.round(rc/dated.length*100):0;
  const mpPct=dated.length?Math.round(mc/dated.length*100):0;
  document.getElementById("sA").innerHTML=`<div class="sb"><div class="ring" style="--rp:${rpPct};--rc:var(--gn)"><span>${rpPct}%</span></div><div><div class="sl">Reportados</div><div class="sv" style="color:var(--gn)">${rc}/${dated.length}</div></div></div>
    <div class="sb"><div class="ring" style="--rp:${mpPct};--rc:var(--pp)"><span>${mpPct}%</span></div><div><div class="sl">Modelos</div><div class="sv" style="color:var(--pp)">${mc}/${dated.length}</div></div></div>`;

  // Hero — próximo reporte
  const hero=document.getElementById("hero");
  if(hero){
    const hnx=dated.find(e=>!e.rep&&e.dy>=0)||nx;
    if(hnx){
      const dd=hnx.dy,dtxt=dd>0?dd:(dd===0?"HOY":Math.abs(dd)),dlab=dd===0?"":dd===1||dd===-1?"d\u00eda":dd<0?"d\u00edas atr\u00e1s":"d\u00edas";
      hero.innerHTML=`<div class="hero"><div class="hero-l"><div class="hero-k">Pr\u00f3ximo reporte</div><div class="hero-t">${hnx.t}<span class="hero-x">${hnx.x}</span></div><div class="hero-n">${hnx.n} \u00b7 ${hnx.q}</div></div><div class="hero-r"><div class="hero-num">${dtxt}</div><div class="hero-unit">${dlab}</div><div class="hero-date">${fd(hnx.d)}</div></div></div>`;
    } else hero.innerHTML="";
  }

  let bH="";
  const nd=P.flatMap(c=>c.q).filter(q=>!q.d).length;
  if(nd>0)bH+=`<div class="ban bb"><h3>${nd} fechas pendientes de la CMF</h3>Algunas empresas chilenas aún no publican fechas. Se actualizarán automáticamente cuando la CMF las suba.</div>`;
  document.getElementById("bns").innerHTML=bH;

  document.getElementById("flt").innerHTML=["all","pending","done"].map(v=>{
    const l={all:"Todos",pending:"Pendientes",done:"Reportados"};
    return`<button class="fb ${cf===v?'a':''}" onclick="sF('${v}')">${l[v]}</button>`}).join("")+
    `<input class="si" placeholder="Buscar ticker..." value="${sq}" oninput="sS(this.value)">`+
    `<div class="vw-tog"><button class="vwb ${vw==='table'?'a':''}" onclick="sV('table')">Tabla</button><button class="vwb ${vw==='cards'?'a':''}" onclick="sV('cards')">Tarjetas</button></div>`+
    `<button class="rb" id="rfb" onclick="rA()">↻ Actualizar</button>`;

  const BUCKETS=[["over","Atrasados"],["week","Esta semana"],["month","Este mes"],["later","M\u00e1s adelante"],["rep","Reportados"],["nd","Sin fecha"]];
  const bucketOf=e=>!e.d?"nd":e.rep?"rep":e.dy<0?"over":e.dy<=7?"week":e.dy<=30?"month":"later";
  const rowHTML=e=>{
    const c=SC[e.st];
    const noDate=!e.d;
    const dl=noDate?"Pendiente":e.rep?"":(e.dy>0?`en ${e.dy}d`:e.dy===0?"Hoy":`hace ${Math.abs(e.dy)}d`);
    const dc=noDate?"var(--t4)":e.dy<=0?"var(--rd)":e.dy<=7?"var(--yw)":"var(--t4)";
    const sb=noDate?"":e.src==="cmf"?`<span class="src sc">CMF</span>`:e.src==="yahoo"?`<span class="src sf">VER</span>`:`<span class="src sm">EST</span>`;
    const rk=e.rep,mk=ic(e.t,e.q,"model");
    const ck1=rk?'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7.5L5.5 10L11 4" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
    const ck2=mk?'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7.5L5.5 10L11 4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
    const today=!e.rep&&e.d&&e.dy===0;
    return`<div class="tr ${e.st==='imminent'?'imm':''} ${today?'today':''}">
      <div><span class="tk">${e.t}</span><span class="ex">${e.x}</span></div>
      <div><div class="cn">${e.n}</div><div class="cs">${e.s}</div></div>
      <span class="qt">${e.q}</span>
      <div><div class="dm">${noDate?'<span style="color:var(--t4)">Sin fecha</span>':fd(e.d)}${sb}</div>${!e.rep&&dl?`<div class="ds" style="color:${dc}">${dl}</div>`:''}</div>
      <span class="bdg ${c.b}">${c.l}</span>
      <div style="text-align:center"><button class="cb ${rk?'cg':''}" onclick="tc('${e.t}','${e.q}','reported')">${ck1}</button></div>
      <div style="text-align:center"><button class="cb ${mk?'cp':''}" onclick="tc('${e.t}','${e.q}','model')">${ck2}</button></div></div>`};

  let rw=`<div class="thr"><span>Ticker</span><span>Empresa</span><span>Quarter</span><span>Fecha</span><span>Estado</span><span style="text-align:center">Reportado</span><span style="text-align:center">Modelo</span></div>`;
  if(!f.length)rw+=`<div class="emp">No hay eventos.</div>`;
  else BUCKETS.forEach(([key,label])=>{
    const items=f.filter(e=>bucketOf(e)===key);
    if(!items.length)return;
    rw+=`<div class="grp"><span>${label}</span><span class="grp-c">${items.length}</span></div>`;
    items.forEach(e=>{rw+=rowHTML(e)});
  });
  document.getElementById("tW").innerHTML=rw;
  document.getElementById("tW").style.display=vw==="table"?"":"none";

  document.getElementById("lg").innerHTML=Object.entries(SC).map(([,v])=>`<div class="li"><span class="ld" style="background:${v.c}"></span>${v.l}</div>`).join("")+
    `<div class="li"><span class="src sc">CMF</span>Oficial CMF</div><div class="li"><span class="src sf">VER</span>Verificada</div><div class="li"><span class="src sm">EST</span>Estimada</div>`;

  document.getElementById("cds").innerHTML=P.filter(co=>!hiddenTickers.includes(co.t)).map(co=>{
    const qs=co.q.filter(q=>q.d);const dn=qs.filter(q=>q.rep||ic(co.t,q.q,"reported")).length;
    const md=qs.filter(q=>ic(co.t,q.q,"model")).length;const tl=qs.length||1;
    const nx2=co.q.find(q=>q.d&&!q.rep&&!ic(co.t,q.q,"reported"));const pc=Math.round(dn/tl*100);
    return`<div class="cd"><div class="cdh"><span class="cdt">${co.t}</span><span class="cdp ${pc===100?'dn':''}">${pc}%</span></div>
      <div class="pb"><div class="pf" style="width:${pc}%;background:${pc===100?'var(--gn)':'#5a8ac0'}"></div></div>
      <div class="cdd"><div>Reportados: ${dn}/${tl}</div><div>Modelos: ${md}/${tl}</div>${nx2?`<div class="cdn">Pr\u00f3ximo: ${nx2.q} \u00b7 ${fd(nx2.d)}</div>`:''}</div></div>`}).join("");
  document.getElementById("cds").style.display=vw==="cards"?"grid":"none";
}catch(e){console.error("Render error:",e)}}

function sF(v){cf=v;rn()}
function sV(v){vw=v;rn()}
function sS(v){sq=v;rn();const i=document.querySelector('.si');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
async function rA(){const b=document.getElementById("rfb");b.disabled=true;b.textContent="↻ Actualizando...";await fCMF();await fYH();b.disabled=false;b.textContent="↻ Actualizar";rn()}

let activeTab="cal",cfgQ="";
function switchTab(id){
  activeTab=id;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("act",b.textContent.trim()===(id==="cal"?"Calendar":"Configuración")));
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("act"));
  document.getElementById(id==="cal"?"tabCal":"tabCfg").classList.add("act");
  if(id==="cfg")renderCfg();
}
function cfgSearch(v){cfgQ=v.toLowerCase();renderCfg();const i=document.querySelector('.cfg-search');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}

function renderCfg(){
  const panel=document.getElementById("cfgPanel");
  const allTickers=P.filter(co=>!hiddenTickers.includes(co.t));
  const hidden=P.filter(co=>hiddenTickers.includes(co.t));

  if(cfgQ)list=list.filter(co=>co.t.toLowerCase().includes(cfgQ)||co.n.toLowerCase().includes(cfgQ)||co.s.toLowerCase().includes(cfgQ));
  const totalActive=allTickers.length;
  const totalCL=allTickers.filter(c=>c.cmfName||c.cmfRut).length;

  let h=`<div class="cfg-hdr"><h2>Portafolio</h2><span class="cfg-count">${totalActive} activos · ${totalCL} chilenas · ${totalIntl} internacionales${hidden.length?` · ${hidden.length} ocultos`:''}</span></div>`;

  // Inline add form
  const secOpts=SECTORS.map(s=>`<option value="${s}">${s}</option>`).join("");

      <div><div class="cs">${co.s}</div></div>

      <div style="text-align:right"><button class="cfg-del" onclick="removeTicker('${co.t}')">Eliminar</button></div>
    </div>`;
  });
  h+=`</div>`;
  if(hidden.length){
    h+=`<div style="margin-top:16px"><div class="cfg-hdr"><h2 style="font-size:13px">Activos ocultos</h2></div>`;
    h+=`<div class="cfg-tbl">`;
    hidden.forEach(co=>{
      h+=`<div class="cfg-tr">
        <div><span class="tk">${co.t}</span></div>
        <div><div class="cn">${co.n}</div></div>
        <div><div class="cs">${co.s}</div></div>
        <span class="cfg-type intl">OCULTO</span>
        <div style="text-align:right"><button class="cfg-del" onclick="restoreTicker('${co.t}')" style="color:var(--bl);border-color:var(--bld)">Restaurar</button></div>
      </div>`;
    });
    h+=`</div></div>`;
  }
  // EmailJS Alert Config
  const maskEmail=e=>{const[u,d]=e.split("@");return u[0]+"***@"+d};
  const emailList=ALERT_EMAILS.map(e=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-family:var(--mn);font-size:12px;color:var(--t1)">${maskEmail(e)}</span><button class="cfg-del" onclick="removeAlertEmail('${e}')" style="padding:1px 6px;font-size:8px">✕</button></div>`).join("");

          <input type="checkbox" id="alPrev" onchange="toggleAlertPrev()" ${alertPrevDay?"checked":""} style="width:auto;cursor:pointer" />

      <div class="add-row" style="margin-top:12px">

// Preview of the next scheduled alerts, so it's obvious the system is armed
function upcomingAlertsLabel(){
  try{
    if(!EJ.serviceId||!ALERT_EMAILS.length)return "";
    const t=new Date();t.setHours(0,0,0,0);
    const rows=[];
    for(let i=0;i<14;i++){
      const d=new Date(t);d.setDate(d.getDate()+i);
      const ds=d.toISOString().split("T")[0];
      const list=earningsOn(ds);
      if(list.length)rows.push({ds,n:list.length,tks:list.map(e=>e.t)});
      if(rows.length>=2)break;
    }
    if(!rows.length)return "Sin reportes en los próximos 14 días.";
    const parts=rows.map(r=>{
      const days=Math.round((new Date(r.ds+"T00:00:00")-t)/86400000);
      const when=days===0?"hoy":days===1?"mañana":`en ${days}d`;
      return `${r.tks.slice(0,4).join(", ")}${r.tks.length>4?` +${r.tks.length-4}`:""} ${when}`;
    });
    return "Próximos avisos: "+parts.join(" · ");
  }catch(e){return ""}
}

//  DATE VERIFICATION — compares portfolio dates against Finnhub
//  Never overwrites without explicit user approval
// =======================================================================
let datePropos=[];        // pending change proposals awaiting approval
let vfRunning=false;

const dayDiff=(a,b)=>Math.round((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000);

// Fetch earnings calendar for one symbol. Window: 8 months back → 15 months forward
async function fhEarnings(sym){
  const t=new Date();
  const from=new Date(t.getFullYear(),t.getMonth()-8,t.getDate()).toISOString().split("T")[0];
  const to=new Date(t.getFullYear(),t.getMonth()+15,t.getDate()).toISOString().split("T")[0];
  const url=`https://finnhub.io/api/v1/calendar/earnings?from=${from}&to=${to}&symbol=${encodeURIComponent(sym)}&token=${FINNHUB_KEY}`;
  const r=await fetch(url,{signal:AbortSignal.timeout(10000)});
  if(r.status===429)throw new Error("rate limit");
  if(r.status===401||r.status===403)throw new Error("API key inválida");
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  return (j.earningsCalendar||[]).filter(e=>e.date).sort((a,b)=>a.date.localeCompare(b.date));
}

// Match Finnhub events to existing quarter labels by date proximity (±45 days).
// Proximity matching avoids fiscal-year label parsing (Q1 FY27, H1 26, Q4 FY26...)
function matchDates(entry,events){
  const used=new Set(),out=[];
  for(const q of entry.q){
    if(!q.d)continue;
    let best=-1,bestDiff=Infinity;
    for(let i=0;i<events.length;i++){
      if(used.has(i))continue;
      const d=Math.abs(dayDiff(q.d,events[i].date));
      if(d<bestDiff){bestDiff=d;best=i}
    }
    if(best>=0&&bestDiff<=45){
      used.add(best);
      if(events[best].date!==q.d)out.push({label:q.q,oldDate:q.d,newDate:events[best].date,shift:dayDiff(events[best].date,q.d)});
    }
  }
  return out;
}

async function verifyAllDates(silent){
  if(vfRunning)return;
  if(!FINNHUB_KEY){
    if(!silent){const s=document.getElementById("vfSt");if(s){s.textContent="⚠ Configurá la API key de Finnhub primero.";s.className="add-st err"}}
    return;
  }
  vfRunning=true;
  datePropos=[];
  const intl=P.filter(c=>c&&c.t&&c.yf&&!hiddenTickers.includes(c.t));
  const noCover=[],failed=[];
  const btn=document.getElementById("vfBtn");
  const st=document.getElementById("vfSt");
  const res=document.getElementById("vfResults");
  if(btn)btn.disabled=true;
  if(res)res.innerHTML="";

  for(let i=0;i<intl.length;i++){
    const c=intl[i];
    if(st&&!silent){st.textContent=`Consultando ${c.t}… (${i+1}/${intl.length})`;st.className="add-st"}
    try{
      const ev=await fhEarnings(c.yf||c.t);
      if(!ev.length){noCover.push(c.t)}
      else{
        const diffs=matchDates(c,ev);
        for(const d of diffs)datePropos.push({ticker:c.t,name:c.n,...d});
      }
    }catch(e){
      failed.push(c.t+" ("+e.message+")");
      console.warn("[verify] "+c.t+":",e.message);
      if(e.message==="rate limit")await new Promise(r=>setTimeout(r,20000));
    }
    // 60 calls/min free tier → 1.1s spacing keeps us well under
    if(i<intl.length-1)await new Promise(r=>setTimeout(r,1100));
  }

  try{localStorage.setItem("ia-verify-last",new Date().toISOString())}catch(e){}
  vfRunning=false;
  if(btn)btn.disabled=false;
  console.log(`[verify] ${datePropos.length} diferencias, ${noCover.length} sin cobertura, ${failed.length} errores`);

  if(silent){
    if(datePropos.length)showVerifyBanner(datePropos.length);
    return;
  }
  renderProposals(noCover,failed);
}

// ── Persistence of verified dates (Firebase + localStorage fallback) ──
function saveVerifiedDates(){
  const map={};
  for(const c of P){
    if(!c||!c.t||!Array.isArray(c.q))continue;
    for(const q of c.q){
      if(q&&q._v&&q.d)map[c.t+"|"+q.q]={d:q.d,s:q._s||"finnhub",v:q._v};
    }
  }
  try{
    if(uf&&dr)dr.child("verified-dates").set(map);
    localStorage.setItem("ia-vd",JSON.stringify(map));
  }catch(e){console.error("[verify] save failed:",e)}
}

function applyVerifiedDates(map){
  if(!map||typeof map!=="object")return 0;
  let n=0;
  for(const k in map){
    const [tk,label]=k.split("|");
    const rec=map[k];
    if(!tk||!label||!rec||!rec.d)continue;
    const c=P.find(x=>x&&x.t===tk);
    if(!c||!Array.isArray(c.q))continue;
    const q=c.q.find(x=>x.q===label);
    if(!q||q.d===rec.d)continue;
    q.d=rec.d;q._s=rec.s||"finnhub";q._v=rec.v;
    n++;
  }
  if(n)console.log(`[verify] ${n} fechas verificadas restauradas`);
  return n;
}

function loadVerifiedDates(){

    const raw=localStorage.getItem("ia-vd");
    if(raw)applyVerifiedDates(JSON.parse(raw));
  }catch(e){}
}

// Fetch up to 4 confirmed earnings dates using Finnhub API (free, 60 calls/min)
// Falls back to Yahoo Finance via CORS proxy if Finnhub key not set or fails
async function fetchEarningsDate(entry){
  const tk=entry.yf||entry.t;
  // Strategy 1: Finnhub earnings calendar (preferred — confirmed dates per quarter)
  if(FINNHUB_KEY){
    try{
      const today=new Date();
      const start=today.toISOString().split("T")[0];
      const end=new Date(today.getFullYear()+1,today.getMonth(),today.getDate()).toISOString().split("T")[0];
      const url=`https://finnhub.io/api/v1/calendar/earnings?from=${start}&to=${end}&symbol=${encodeURIComponent(tk)}&token=${FINNHUB_KEY}`;
      const r=await fetch(url,{signal:AbortSignal.timeout(8000)});
      if(r.ok){
        const j=await r.json();
        const events=(j.earningsCalendar||[]).filter(e=>e.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
        if(events.length){
          entry.q=events.map(e=>{
            const yr=String(e.year||today.getFullYear()).slice(2);
            const lbl=e.quarter?`Q${e.quarter} ${yr}`:`Earnings`;
            return{q:lbl,d:e.date,_s:"finnhub"};
          });
          console.log(`[finnhub] ${tk}: ${events.length} dates found`);
          return;
        }
        console.warn(`[finnhub] ${tk}: no earnings calendar entries`);
      } else {
        console.warn(`[finnhub] ${tk}: HTTP ${r.status}`);
      }
    }catch(e){console.warn(`[finnhub] ${tk} error:`,e.message)}
  }
  // Strategy 2: Yahoo via proxies (fallback — only finds next earnings, not all quarters)
  const proxies=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u)];
  for(const mk of proxies){
    try{
      const r=await fetch(mk("https://query1.finance.yahoo.com/v7/finance/quote?symbols="+tk),{signal:AbortSignal.timeout(4000)});
      if(!r.ok)continue;const j=await r.json();const q=j.quoteResponse?.result?.[0];
      if(q?.earningsTimestamp){const d=new Date(q.earningsTimestamp*1000).toISOString().split("T")[0];
        entry.q=[{q:"Próximo",d,_s:"yahoo"}];console.log(`[yahoo] ${tk}: ${d}`);return}
      if(q?.earningsTimestampStart){const d=new Date(q.earningsTimestampStart*1000).toISOString().split("T")[0];
        entry.q=[{q:"Próximo",d,_s:"yahoo"}];console.log(`[yahoo] ${tk}: ${d}`);return}
    }catch(e){}
  }
  for(const mk of proxies){
    try{
      const r=await fetch(mk("https://query1.finance.yahoo.com/v10/finance/quoteSummary/"+tk+"?modules=calendarEvents"),{signal:AbortSignal.timeout(4000)});
      if(!r.ok)continue;const j=await r.json();const ev=j.quoteSummary?.result?.[0]?.calendarEvents?.earnings;
      if(ev?.earningsDate?.length){const d=new Date(ev.earningsDate[0].raw*1000).toISOString().split("T")[0];
        entry.q=[{q:"Próximo",d,_s:"yahoo"}];console.log(`[yahoo] ${tk}: ${d}`);return}
    }catch(e){}
  }
  console.warn(`[fetchEarnings] ${tk}: no dates found from any source`);
}

  else{localStorage.setItem("ia-ct",JSON.stringify(custom));localStorage.setItem("ia-ht",JSON.stringify(hiddenTickers.filter(x=>x)))}
}

function loadCustomTickers(){
  try{
    const raw=localStorage.getItem("ia-ct");
    if(raw){
      const arr=JSON.parse(raw);
      if(Array.isArray(arr)){

}

  saveEJConfig();renderCfg();
}

}

// Next scheduled reports after a given date — gives the reader forward visibility
function upcomingAfter(dateStr,limit){
  const out=[];
  const base=new Date(dateStr+"T00:00:00");
  for(let i=1;i<=60&&out.length<limit;i++){
    const d=new Date(base);d.setDate(d.getDate()+i);
    const ds=d.toISOString().split("T")[0];
    for(const e of earningsOn(ds)){
      out.push({...e,days:i});
      if(out.length>=limit)break;
    }
  }
  return out;
}

// Season progress across every dated quarter in the portfolio
function seasonStats(){
  let rep=0,tot=0;
  for(const co of P){
    if(!co||!co.t||hiddenTickers.includes(co.t))continue;
    for(const q of (Array.isArray(co.q)?co.q:[])){
      if(!q||!q.d)continue;
      tot++;
      if(ic(co.t,q.q,"reported"))rep++;
    }
  }
  return{rep,tot,pct:tot?Math.round(rep/tot*100):0};
}

async function sendEmailJS(toEmail,subject,htmlBody){
  const res=await fetch("https://api.emailjs.com/api/v1.0/email/send",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      service_id:EJ.serviceId,
      template_id:EJ.templateId,
      user_id:EJ.publicKey,
      // name/email feed the template's "From Name" and "Reply To" fields
      template_params:{
        to_email:toEmail,
        subject:subject,
        message:htmlBody,
        name:"iA Earnings Calendar",
        email:TEST_EMAIL||toEmail
      }
    })
  });
  if(!res.ok)throw new Error(await res.text());
  return res;
}

// Collects earnings scheduled for a given date, skipping ones already marked reported
function earningsOn(dateStr){
  return P.filter(co=>co&&co.t&&!hiddenTickers.includes(co.t))
    .flatMap(co=>(Array.isArray(co.q)?co.q:[]).map(q=>({t:co.t,n:co.n,s:co.s,x:co.x,q:q.q,d:q.d,src:q._s||"manual"})))
    .filter(e=>e.d===dateStr&&!ic(e.t,e.q,"reported"));
}

async function sendAlertBatch(list,dateStr,mode){
  const isPrev=mode==="prev";
  const html=buildEmailHTML(list,fd(dateStr),mode);
  const tks=list.map(e=>e.t).join(", ");
  const subj=isPrev
    ? `iA Earnings — ${tks} reporta${list.length>1?'n':''} mañana`
    : `iA Earnings — ${tks} reporta${list.length>1?'n':''} hoy`;
  for(const email of ALERT_EMAILS){await sendEmailJS(email,subj,html)}
  console.log(`[alert] ${mode} enviado a ${ALERT_EMAILS.length} destinatarios:`,tks);
}

async function checkAndSendAlerts(){
  if(!EJ.serviceId||!EJ.templateId||!EJ.publicKey)return;
  if(!ALERT_EMAILS.length)return;
  const t=new Date();t.setHours(0,0,0,0);
  const todayStr=t.toISOString().split("T")[0];
  const tm=new Date(t);tm.setDate(tm.getDate()+1);
  const tmStr=tm.toISOString().split("T")[0];

  // Day-of alert
  try{
    const k="ia-alert-"+todayStr;
    if(!localStorage.getItem(k)){
      const list=earningsOn(todayStr);
      if(list.length){await sendAlertBatch(list,todayStr,"day");localStorage.setItem(k,"1")}
    }
  }catch(e){console.error("[alert] day-of falló:",e)}

  // Day-before reminder (separate key so both can fire the same session)
  if(alertPrevDay){
    try{
      const k="ia-prev-"+tmStr;
      if(!localStorage.getItem(k)){
        const list=earningsOn(tmStr);
        if(list.length){await sendAlertBatch(list,tmStr,"prev");localStorage.setItem(k,"1")}
      }
    }catch(e){console.error("[alert] día previo falló:",e)}
  }
}

// Test emails pull the REAL data for the matching date, so what you preview is
// exactly what would be sent. Falls back to obviously-fake demo rows if nothing
// is scheduled, and says so.
function testAlert(){
  if(!EJ.serviceId||!EJ.templateId||!EJ.publicKey){alert("Configurá las credenciales de EmailJS primero.");return}
  if(!TEST_EMAIL){alert("Definí primero el correo para pruebas.");return}
  const ds=new Date().toISOString().split("T")[0];
  let list=earningsOn(ds),demo=false;
  if(!list.length){
    demo=true;
    list=[{t:"DEMO",n:"Ticker de ejemplo",s:"—",q:"Q0 00",x:"NYSE",src:"manual",d:ds}];
  }
  const html=buildEmailHTML(list,fd(ds),"day");
  const subj=demo
    ? "iA Earnings — Prueba (sin reportes hoy)"
    : `iA Earnings — PRUEBA · ${list.map(e=>e.t).join(", ")} reporta${list.length>1?"n":""} hoy`;
  sendEmailJS(TEST_EMAIL,subj,html)
    .then(()=>alert(demo
      ? "✓ Prueba enviada SOLO a "+TEST_EMAIL+"\n\nHoy no hay reportes agendados, así que el correo usa una fila de ejemplo."
      : "✓ Prueba enviada SOLO a "+TEST_EMAIL+"\n\nCon los datos reales de hoy: "+list.map(e=>e.t).join(", ")))
    .catch(e=>alert("✗ Error: "+e.message));
}

function saveTestEmail(){
  const v=(document.getElementById("tstEmail")?.value||"").trim();
  const st=document.getElementById("alSt");

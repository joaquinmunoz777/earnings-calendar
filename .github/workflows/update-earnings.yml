name: Update Earnings Dates

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  update-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull latest changes
        run: git pull origin main

      - name: Update earnings dates via Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-earnings.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "iA Earnings Bot"
          git config user.email "bot@iadriana.cl"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update earnings dates $(date +%Y-%m-%d)"
            git push
          fi
